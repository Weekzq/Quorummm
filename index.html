<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кворум — помощник учителя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-brand">Кворум</div>
      <div class="login-sub">Вход для учителя</div>
      <input id="login-password" type="password" placeholder="Пароль" autofocus>
      <button type="submit" class="btn btn-primary">Войти</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <!-- Основное приложение -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">Кворум</div>
      <div class="sub">помощник учителя</div>
      <button id="logout" class="btn btn-ghost" style="margin-left:auto">Выйти</button>
    </header>

    <main class="container">
      <section class="card">
        <h2>Ученики</h2>
        <div class="row">
          <textarea id="names-input" rows="3"
            placeholder="Вставь список, по одному в строке"></textarea>
        </div>
        <div class="row">
          <button id="add-names" class="btn">Добавить</button>
          <button id="clear-all" class="btn btn-ghost">Очистить всё</button>
        </div>
      </section>

      <section class="card">
        <h2>Присутствие</h2>
        <ul id="students-list" class="check-list"></ul>
        <button id="save-presence" class="btn">Сохранить присутствие</button>
      </section>

      <section class="card">
        <h2>Команды</h2>
        <div class="row">
          <label for="n-groups">Сколько команд</label>
          <input id="n-groups" type="number" min="2" max="10" value="3">
          <button id="split" class="btn btn-primary">Разделить на команды</button>
        </div>
        <div id="teams" class="teams"></div>
      </section>

      <section class="card">
        <h2>Значки за активность</h2>
        <p class="hint">Не оценки — просто отметки внимания и участия.</p>

        <div class="badges-picker">
          <label>Ученик
            <select id="badge-student"></select>
          </label>
          <label>Значок
            <select id="badge-type">
              <option value="active">Активный ответ</option>
              <option value="exact">Точный ответ</option>
              <option value="team">Помог команде</option>
              <option value="attention">Внимание</option>
              <option value="idea">Смелая гипотеза</option>
            </select>
          </label>
          <button id="give-badge" class="btn btn-primary">Дать значок</button>
        </div>

        <div id="badges-total" class="badges-total"></div>
      </section>

      <section class="card">
        <h2>Урок</h2>
        <div class="lesson">
          <div>
            <div class="label">Кто отвечает?</div>
            <div id="picked" class="picked">—</div>
            <button id="pick" class="btn btn-primary">Выбрать ученика</button>
          </div>
          <div>
            <div class="label">Счёт команд</div>
            <div id="scores" class="scores"></div>
          </div>
        </div>
        <div class="row" style="margin-top:16px">
          <textarea id="note" rows="3" placeholder="Заметки урока"></textarea>
        </div>
        <button id="save-note" class="btn">Сохранить заметку</button>
      </section>
    </main>

    <footer class="footer">
      <span>Quorum · сделал Никита</span>
      <span>2026</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
